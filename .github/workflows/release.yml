name: Release

# Runs only when a tag (e.g. v0.1.5) is pushed. `git archive` builds the zip
# straight from that tag's tracked tree — untracked/gitignored paths
# (storage/isx_*, storage/backups/*.wpress, etc.) are never included since
# they were never committed, and .gitattributes export-ignores dev-only files
# that ARE tracked (this workflow itself).
on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: git archive --format=zip --prefix=insightx-backup/ -o "insightx-backup-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: insightx-backup-${{ github.ref_name }}.zip
          name: 'insightx-backup ${{ github.ref_name }}'
