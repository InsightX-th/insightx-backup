name: CI

# Lint (PHP 7.4+ compatibility), unit suite (tests/run.php) on every
# supported PHP version, and a real WordPress + MySQL integration run
# (tests/e2e/run.sh) on every push to main and every pull request.
# Failing a matrix row fails the run — the suite covers the import
# restore/sweep logic that has historically broken in ways a syntax check
# alone never caught.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # PHP 7.4+ compatibility (readme.txt "Requires PHP"). Only the
  # PHPCompatibilityWP ruleset — no style rules. RemovedExtensions is excluded
  # because it matches any name starting with an old extension's prefix
  # (e.g. our own self::recode_base64() looks like ext/recode).
  lint:
    name: Lint (PHP 7.4+ compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHPCompatibilityWP
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer:^3 phpcompatibility/phpcompatibility-wp:^2 dealerdirect/phpcodesniffer-composer-installer

      - name: Check PHP 7.4+ compatibility
        run: |
          "$(composer global config bin-dir --absolute --quiet)/phpcs" -p \
            --standard=PHPCompatibilityWP --runtime-set testVersion 7.4- \
            --exclude=PHPCompatibility.Extensions.RemovedExtensions \
            --extensions=php --ignore='*/libs/*,*/vendor/*' .

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib

      # xargs, not `find -exec … \;` — find exits 0 even when php -l fails.
      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: php tests/run.php

  # Real WordPress + MySQL end to end (tests/e2e/run.sh). One PHP version is
  # enough here — the matrix above already covers the language versions.
  integration:
    name: Integration (PHP 8.2, WP latest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd, zlib, curl
          tools: wp-cli

      - name: WordPress core
        run: wp core download --path=/tmp/wpcore --quiet

      - name: End-to-end (tests/e2e/run.sh)
        env:
          DB_HOST: 127.0.0.1:3306
          DB_USER: root
          DB_PASS: root
          WP_CORE: /tmp/wpcore
        run: WP_CLI="$(command -v wp)" bash tests/e2e/run.sh
