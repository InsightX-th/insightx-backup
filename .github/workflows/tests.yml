name: Tests

# Runs the self-contained test suite (tests/run.php) on every push to main
# and every pull request, across the PHP versions the plugin supports
# (readme.txt: PHP 7.4+). Failing a matrix row fails the run — the suite
# covers the import restore/sweep logic that has historically broken in ways
# a syntax check alone never caught.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib

      - name: Run test suite
        run: php tests/run.php

  # Real WordPress + MySQL end to end (tests/e2e/run.sh). One PHP version is
  # enough here — the matrix above already covers the language versions.
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd, zlib, curl
          tools: wp-cli

      - name: WordPress core
        run: wp core download --path=/tmp/wpcore --quiet

      - name: End-to-end
        env:
          DB_HOST: 127.0.0.1:3306
          DB_USER: root
          DB_PASS: root
          WP_CORE: /tmp/wpcore
        run: WP_CLI="$(command -v wp)" bash tests/e2e/run.sh
