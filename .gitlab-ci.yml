stages:
  - build
  - release

# Runs only when a tag (e.g. v0.1.1) is pushed. `git archive` builds the zip
# straight from that tag's tracked tree — untracked/gitignored paths
# (storage/isx_*, storage/backups/*.wpress, etc.) are never included since
# they were never committed, and .gitattributes export-ignores dev-only files
# that ARE tracked (this CI config itself).
build_zip:
  stage: build
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache git curl
    - git archive --format=zip --prefix=insightx-backup/ -o "insightx-backup-${CI_COMMIT_TAG}.zip" "${CI_COMMIT_TAG}"
    - >
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "insightx-backup-${CI_COMMIT_TAG}.zip"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/insightx-backup/${CI_COMMIT_TAG}/insightx-backup-${CI_COMMIT_TAG}.zip"
  artifacts:
    paths:
      - "insightx-backup-*.zip"

# Publishes a GitLab Release for the tag and links the zip uploaded above as
# a release asset — this is exactly what ISX_GitLabApi::enableReleaseAssets()
# in insightx-backup.php reads to offer "There is a new version... update now".
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - build_zip
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'insightx-backup $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'insightx-backup.zip'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/insightx-backup/${CI_COMMIT_TAG}/insightx-backup-${CI_COMMIT_TAG}.zip'
